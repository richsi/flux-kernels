[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-kernels"
version = "0.1.0"
description = "FLUX kernels"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "ric" }
]
dependencies = [
    "torch",
    "triton",
    "matplotlib",
    "pandas",
    "diffusers",
]

[project.optional-dependencies]
testing = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]